name: 24/7 Seasonal & Holiday Flash Sale Timer

on:
  schedule:
    # Runs daily at 9:00 AM EST (14:00 UTC) to check seasonal sale dates
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      force_sale:
        description: 'Force immediate flash sale announcement broadcast'
        required: false
        type: boolean
        default: false

jobs:
  run-holiday-flash-sale:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run Holiday Flash Sale Check
        run: |
          python scripts/holiday_flash_sale.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          FORCE_SALE: ${{ github.event.inputs.force_sale }}
