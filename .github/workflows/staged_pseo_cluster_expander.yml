name: Staged Programmatic SEO Cluster Expander

on:
  schedule:
    # Runs bi-weekly on Mondays at 12:00 PM EST (17:00 UTC) to check milestones
    - cron: '0 17 * * 1'
  workflow_dispatch:
    inputs:
      force_batch:
        description: 'Force immediate deployment of the next staged cluster batch (2,000-5,000 pages)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  staged-pseo-expansion:
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 urllib3

      - name: 🚀 Run Staged pSEO Expansion Check
        run: |
          if [ "${{ github.event.inputs.force_batch }}" = "true" ]; then
            python scripts/staged_pseo_cluster_expander.py --force
          else
            python scripts/staged_pseo_cluster_expander.py --auto
          fi

      - name: 💾 Commit and push staged cluster updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/pseo_expansion_state.json
          if ! git diff --staged --quiet; then
            git commit -m "feat(pseo): deploy staged pSEO cluster batch [skip ci]"
            git push
          else
            echo "No staged cluster batch changes to commit (conditions in standby)."
          fi
