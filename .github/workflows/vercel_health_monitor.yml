name: 24/7 Vercel Production Health & 404 Monitor

on:
  schedule:
    # Runs daily at 7:00 AM EST (12:00 UTC)
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  run-vercel-health-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run Vercel Production Health Audit
        run: |
          python scripts/vercel_health_monitor.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
