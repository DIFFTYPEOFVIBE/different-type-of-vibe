name: Weekly Email List Hygiene & Deliverability Cleaner

on:
  schedule:
    # Runs every Sunday at 11:00 PM EST (04:00 UTC Monday)
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  clean-email-list:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run Subscriber Name Cleansing & List Hygiene
        run: |
          python scripts/fix_contact_names.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
