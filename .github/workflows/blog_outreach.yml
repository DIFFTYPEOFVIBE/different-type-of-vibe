name: 24/7 Automated Blog & Press Outreach Engine

on:
  schedule:
    # Runs Monday, Wednesday, and Friday at 10:00 AM EST (15:00 UTC)
    - cron: '0 15 * * 1,3,5'
  workflow_dispatch:

jobs:
  run-blog-outreach:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv pandas

      - name: Run Automated Blog & Press Outreach Cycle
        run: |
          python scripts/blog_outreach_manager.py --auto
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
