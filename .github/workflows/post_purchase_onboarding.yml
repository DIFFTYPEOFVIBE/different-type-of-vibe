name: 24/7 Post-Purchase Customer Onboarding & Retention Engine

on:
  schedule:
    # Runs daily at 3:00 PM EST (20:00 UTC)
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  run-post-purchase-onboarding:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run Post-Purchase Customer Onboarding Sequence
        run: |
          python scripts/post_purchase_onboarding.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
