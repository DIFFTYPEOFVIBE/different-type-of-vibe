name: 24/7 SEO & Backlink Autopilot Engine

on:
  schedule:
    # 4:00 AM EST (08:00 UTC)
    - cron: '0 8 * * *'
    # 10:00 AM EST (14:00 UTC)
    - cron: '0 14 * * *'
    # 3:30 PM EST (20:30 UTC)
    - cron: '30 20 * * *'
  workflow_dispatch:

jobs:
  run-seo-autopilot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run Daily Backlink Builder & Crawler Pings
        run: |
          python scripts/daily_backlink_builder.py
        env:
          PUBLIC_MEDIA_BASE_URL: "https://differenttypeofvibe.com/api/media"

      - name: Submit Live Sitemap to IndexNow
        run: |
          python scripts/indexnow_submitter.py

      - name: Run Organic SEO Autopilot Engine Cycle
        run: |
          python scripts/seo_autopilot_engine.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          LEMONSQUEEZY_API_KEY: ${{ secrets.LEMONSQUEEZY_API_KEY }}
          LEMONSQUEEZY_STORE_ID: ${{ secrets.LEMONSQUEEZY_STORE_ID }}
          LEMONSQUEEZY_WEBHOOK_SECRET: ${{ secrets.LEMONSQUEEZY_WEBHOOK_SECRET }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
